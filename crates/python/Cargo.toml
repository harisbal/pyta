[package]
name = "pytraf-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_pytraf"
crate-type = ["cdylib"]

[dependencies]
rayon = "1"
numpy = "0.29.0"
pyo3 = { version = "0.29.3", features = ["abi3-py39"] }
pytraf-core = { path = "../core" }
pytraf-io = { path = "../io" }
