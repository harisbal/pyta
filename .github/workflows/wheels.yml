name: wheels

# Builds wheels for Linux, macOS and Windows plus the source distribution.
# Publishing a GitHub release attaches them to it and uploads them to PyPI; "Run workflow"
# only builds them (download from the run's artifacts).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One abi3 wheel per platform covers every Python from 3.9.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto
      - name: Test the wheel
        shell: bash
        run: |
          python -m venv test-env
          if [ -d test-env/Scripts ]; then PY="$PWD/test-env/Scripts/python"; else PY="$PWD/test-env/bin/python"; fi
          "$PY" -m pip install pytest pandas
          "$PY" -m pip install --no-index --find-links dist pytraf
          # run from another directory so the installed wheel is imported, not python/pytraf
          cd "$RUNNER_TEMP"
          "$PY" -m pytest -q "$GITHUB_WORKSPACE/python/tests"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: attach to release
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"

  pypi:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this workflow and environment, so no token is stored.
    environment:
      name: pypi
      url: https://pypi.org/p/pytraf
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
