[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pyta"
version = "0.1.0"
description = "Static traffic assignment with a Rust core: path-based, turn delays, multiple classes."
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
test = ["pytest>=7", "pandas>=1.5"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.7,<10", "mkdocstrings[python]>=0.26", "ruff"]

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "pyta._pyta"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
